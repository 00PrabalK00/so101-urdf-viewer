<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SO101 URDF Viewer</title>
<style>
  body { margin:0; overflow:hidden; font:14px system-ui, sans-serif; background:#1e1f24; color:#e4e4e4; }
  #panel { position:absolute; z-index:10; top:0; left:0; width:300px; height:100vh; overflow:auto; background:#16171b; border-right:1px solid #2c2d33; padding:12px; box-sizing:border-box; }
  #panel h2 { margin:12px 0 6px; font-size:18px; }
  label { display:block; margin:4px 0; }
  .j { margin:6px 0; }
  .j input { width:100%; }
  .val { float:right; color:#9cf; }
  .lbl { color:#fff; font:12px monospace; background:rgba(0,0,0,.6); padding:1px 4px; border-radius:3px; pointer-events:none; }
  .lbl.joint { color:#ffcf6b; }
  .lbl.dim { color:#7fe0ff; }
  pre { font-size:12px; white-space:pre; color:#bbb; }
  select { width:100%; }
  .note { color:#9a9aa3; font-size:13px; line-height:1.4; }

  #tfToggle { position:absolute; z-index:11; top:10px; right:10px; font-size:14px; padding:4px 10px; }
  #tf { position:absolute; z-index:10; top:0; right:0; width:470px; height:100vh; overflow:auto; background:#16171b; border-left:1px solid #2c2d33; padding:48px 16px 24px; box-sizing:border-box; }
  #tf.hidden { display:none; }
  #tf h2 { font-size:22px; margin:0 0 8px; }
  .opts { background:#1f2026; border-radius:6px; padding:8px 10px; margin:8px 0 12px; }
  .card { background:#1f2026; border:1px solid #2c2d33; border-radius:8px; padding:12px 14px; margin:12px 0; }
  .card h3 { margin:0 0 2px; font-size:19px; color:#fff; }
  .card .sub { color:#9cf; font-size:14px; margin-bottom:8px; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; margin:6px 0 10px; }
  .facts span:nth-child(odd) { color:#9a9aa3; }
  .facts span:nth-child(even) { font-family:ui-monospace, Consolas, monospace; color:#cfe8cf; word-break:break-all; }
  .facts b { color:#7fe0ff; font-weight:600; }
  .mlabel { color:#9a9aa3; font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin:10px 0 4px; }
  .mat { display:inline-grid; grid-template-columns:repeat(4, auto); column-gap:18px; row-gap:3px; padding:4px 12px;
         border-left:2px solid #888; border-right:2px solid #888; border-radius:6px; font:15px ui-monospace, Consolas, monospace; }
  .mat span { text-align:right; min-width:3.2em; }
  .mat span.t { color:#7fe0ff; }          /* translation column */
  .mat span.v { color:#ffd27a; }          /* depends on θ */
  .mat span.z { color:#6c6c74; }          /* zero / constant row */
  .mat.num span { color:#ffd27a; }
  .mat.num span.t { color:#7fe0ff; }
  .mat.num span.z { color:#6c6c74; }
  .theta { font:14px ui-monospace, Consolas, monospace; color:#ffd27a; margin:4px 0; }
  .eq { font-size:13px; color:#cfcfd6; margin:4px 0; }
  .tip { font:15px ui-monospace, Consolas, monospace; color:#7fe0ff; margin-top:8px; white-space:pre-line; }
  .dht { border-collapse:collapse; font:14px ui-monospace, Consolas, monospace; width:100%; }
  .dht th, .dht td { border-bottom:1px solid #2c2d33; padding:4px 6px; text-align:right; }
  .dht th { color:#9a9aa3; font-weight:600; }
  .dht td:nth-child(2) { color:#ffd27a; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/": "https://unpkg.com/three@0.160.0/",
  "urdf-loader": "https://unpkg.com/urdf-loader@0.12.3/src/URDFLoader.js"
} }
</script>
</head>
<body>
<div id="panel">
  <h2>URDF</h2>
  <select id="file">
    <option>so101_new_calib.urdf</option>
    <option>so101_new_calib_camera.urdf</option>
    <option>so101_old_calib.urdf</option>
    <option>so101_leader_new_calib.urdf</option>
  </select>
  <h2>Display</h2>
  <label><input type="checkbox" id="fkMode" checked> <b>FK frames only</b> ({0}…{5}, {E})</label>
  <label><input type="checkbox" id="lightBg"> White background</label>
  <button id="savePng">Save PNG (with labels)</button>
  <label><input type="checkbox" id="showMesh" checked> Meshes</label>
  <label><input type="checkbox" id="transparent" checked> Transparent meshes</label>
  <label><input type="checkbox" id="showLinkAxes" checked> Link frames</label>
  <label><input type="checkbox" id="showLinkLabels" checked> Link labels</label>
  <label><input type="checkbox" id="showJointAxis" checked> Joint axes (yellow)</label>
  <label><input type="checkbox" id="showJointLabels"> Joint labels</label>
  <label>Axis size <input type="range" id="axSize" min="0.01" max="0.1" step="0.005" value="0.04"></label>
  <label>Axis thickness <input type="range" id="axThick" min="0.5" max="6" step="0.25" value="2.5"></label>
  <h2>Joints <button id="zero">zero</button></h2>
  <div id="joints"></div>
  <h2>Tree</h2>
  <pre id="tree"></pre>
  <div class="note">X red · Y green · Z blue</div>
</div>
<button id="tfToggle">Transforms ⇆</button>
<div id="tf">
  <h2>Consecutive transforms ⁱ⁻¹Tᵢ</h2>
  <div class="opts">
    <label>Frame convention
      <select id="conv">
        <option value="zup" selected>Z-up: every frame parallel to {0} at zero pose</option>
        <option value="urdf">URDF: Z = joint axis (as in the file)</option>
        <option value="dh">DH (standard / Spong): Z = joint axis, X = common normal</option>
      </select></label>
    <div class="note" id="convNote"></div>
    <label><input type="checkbox" id="showDims" checked> Show link lengths in 3D</label>
  </div>
  <div class="note">Colours: <span style="color:#ffd27a">θ-dependent</span> · <span style="color:#7fe0ff">translation (mm)</span> · <span style="color:#6c6c74">constant</span></div>
  <div id="pairs"></div>
  <div class="card">
    <h3 id="fullTitle">⁰T_E</h3>
    <div class="sub" id="fullSub"></div>
    <div class="mat num" id="full"></div>
    <div class="tip" id="tip"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/examples/jsm/renderers/CSS2DRenderer.js';
import URDFLoader from 'urdf-loader';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1f24);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.001, 10);
camera.position.set(0.45, 0.35, 0.45);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position:'absolute', top:'0', pointerEvents:'none', zIndex:'1' });
document.body.appendChild(labelRenderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.15, 0);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(1,2,1); scene.add(dl);
const grid = new THREE.GridHelper(1, 20, 0x555555, 0x333333); scene.add(grid);
// world frame (Z-up shown in robot coordinates)
const world = new THREE.Group(); world.rotation.x = -Math.PI/2; scene.add(world);

const $ = id => document.getElementById(id);
let robot = null, linkAxes = [], linkLabels = [], jointAxes = [], jointLabels = [];
const meshMat = new THREE.MeshStandardMaterial({ color:0xd8d8d8, metalness:0.1, roughness:0.6, transparent:true, opacity:0.45, depthWrite:false });

// WebGL ignores line width, so frames are built from solid cylinder + cone meshes.
const axisMats = [0xff3b3b, 0x3bdc4a, 0x3b7bff, 0xffcf6b].map(c => new THREE.MeshBasicMaterial({ color:c }));
const shaftGeo = new THREE.CylinderGeometry(1, 1, 1, 12); shaftGeo.translate(0, 0.5, 0);
const headGeo = new THREE.ConeGeometry(1, 1, 16); headGeo.translate(0, 0.5, 0);
const Y = new THREE.Vector3(0, 1, 0);

function meshArrow(mat) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(shaftGeo, mat), new THREE.Mesh(headGeo, mat));
  return g;
}
// length in metres, thickness = shaft radius in mm
function sizeArrow(g, length, thick) {
  const r = thick / 1000, head = Math.min(length * 0.3, r * 6);
  const [shaft, cone] = g.children;
  shaft.scale.set(r, length - head, r);
  cone.scale.set(r * 2.2, head, r * 2.2);
  cone.position.y = length - head;
}
function makeFrame() {
  const g = new THREE.Group();
  [new THREE.Vector3(1,0,0), Y, new THREE.Vector3(0,0,1)].forEach((d, i) => {
    const a = meshArrow(axisMats[i]); a.quaternion.setFromUnitVectors(Y, d); g.add(a);
  });
  return g;
}

// Frames used for forward kinematics: base, one per revolute joint (z = rotation axis), tool.
const FK_FRAMES = {
  base_link:          '{0} base',
  shoulder_link:      '{1} shoulder_pan θ1',
  upper_arm_link:     '{2} shoulder_lift θ2',
  lower_arm_link:     '{3} elbow_flex θ3',
  wrist_link:         '{4} wrist_flex θ4',
  gripper_link:       '{5} wrist_roll θ5',
  gripper_frame_link: '{E} end-effector',
};

// Consecutive FK pairs (top 3 rows; bottom row is always 0 0 0 1). Symbolic forms were derived
// by hand from so101_new_calib.urdf and checked element-wise against the URDF and so101_new_calib.xml.
// Z-up convention: every frame is parallel to {0} when all joints are 0 (Z up, X forward),
// so each ⁱ⁻¹Tᵢ = Trans(d) · Rot(axis, qᵢ). Offsets d are the zero-pose differences between
// frame origins in {0}; checked against the URDF chain at 500 random poses (error < 0.005 mm).
// q1 = −θ1 and q5 = −θ5 because those URDF axes point along −Z and −X.
const CHAIN = [
  { joint:'shoulder_pan', name:'⁰T₁', from:'{0} base', to:'{1} shoulder_pan',
    sym:   [['-c1','s1','0','38.84'], ['s1','c1','0','0'], ['0','0','-1','62.40']],
    zup:   [['c1','-s1','0','38.84'], ['s1','c1','0','0'], ['0','0','1','62.40']],
    zq:'q1 = −θ1, rotation about Z', zsign:-1 },
  { joint:'shoulder_lift', name:'¹T₂', from:'{1} shoulder_pan', to:'{2} shoulder_lift',
    sym:   [['s2','c2','0','-30.40'], ['0','0','1','-18.28'], ['c2','-s2','0','-54.20']],
    zup:   [['c2','0','s2','30.40'], ['0','1','0','-18.28'], ['-s2','0','c2','54.20']],
    zq:'q2 = θ2, rotation about Y', zsign:1 },
  { joint:'elbow_flex', name:'²T₃', from:'{2} shoulder_lift', to:'{3} elbow_flex',
    sym:   [['-s3','-c3','0','-112.57'], ['c3','-s3','0','-28.00'], ['0','0','1','0']],
    zup:   [['c3','0','s3','28.00'], ['0','1','0','0'], ['-s3','0','c3','112.57']],
    zq:'q3 = θ3, rotation about Y', zsign:1 },
  { joint:'wrist_flex', name:'³T₄', from:'{3} elbow_flex', to:'{4} wrist_flex',
    sym:   [['s4','c4','0','-134.90'], ['-c4','s4','0','5.20'], ['0','0','1','0']],
    zup:   [['c4','0','s4','134.90'], ['0','1','0','0'], ['-s4','0','c4','5.20']],
    zq:'q4 = θ4, rotation about Y', zsign:1 },
  { joint:'wrist_roll', name:'⁴T₅', from:'{4} wrist_flex', to:'{5} wrist_roll',
    eq:'φ = θ5 − 0.0487 rad (2.79°, pitch offset in the URDF rpy)',
    sym:   [['-cos φ','sin φ','0','0'], ['0','0','1','-61.10'], ['sin φ','cos φ','0','18.10']],
    zup:   [['1','0','0','61.10'], ['0','c5','-s5','18.10'], ['0','s5','c5','0']],
    zq:'q5 = −θ5, rotation about X', zsign:-1 },
  { joint:'gripper_frame_joint', name:'⁵T_E', from:'{5} wrist_roll', to:'{E} end-effector',
    eq:'fixed — no joint variable',
    sym:   [['-1','0','0','-7.90'], ['0','1','0','-0.22'], ['0','0','-1','-98.13']],
    zup:   [['1','0','0','98.13'], ['0','1','0','0.17'], ['0','0','1','-7.90']],
    zq:'fixed — no joint variable' },
];
const CONV_NOTE = {
  zup: 'ⁱ⁻¹Tᵢ = Trans(d) · Rot(axis, qᵢ). All frames have Z up and X forward at zero pose. cᵢ = cos qᵢ, sᵢ = sin qᵢ. Not DH: Z is not the joint axis for joints 2–5.',
  urdf: 'ⁱ⁻¹Tᵢ = Trans(xyz) · Rot(rpy) · Rz(θᵢ), exactly as in the URDF. cᵢ = cos θᵢ, sᵢ = sin θᵢ.',
  dh: 'Standard DH (Spong): zᵢ₋₁ on joint i axis, xᵢ along the common normal from zᵢ₋₁ to zᵢ. Pink = aᵢ, cyan = dᵢ in 3D. {5} is the tool frame at the gripper tip.',
};
// Per-link rotation that turns a URDF link frame into its Z-up frame: Cᵢ = (⁰Rᵢ at zero pose)ᵀ.
const zupRot = {};

// Standard (Spong) DH: Aᵢ = Rz(θᵢ)·Tz(dᵢ)·Tx(aᵢ)·Rx(αᵢ), θᵢ = s·qᵢ + offset (qᵢ = URDF/motor angle).
// Derived from the zero-pose joint axis lines of so101_new_calib.urdf: every frame checked for
// x ⊥ z₋₁, x ⊥ z, x meets z₋₁, z on the joint axis; DH chain matches the URDF to < 0.005 mm at 500 poses.
// {0}: on the pan axis at table level (base_link + 38.84 mm in x). {5}: tool frame at the gripper tip.
const DH = [
  { joint:'shoulder_pan',  s:-1, off:0,        d:116.6,    a:30.3992,  al:-90,
    sym:[['c1','0','-s1','30.40·c1'], ['s1','0','c1','30.40·s1'], ['0','-1','0','116.60']] },
  { joint:'shoulder_lift', s: 1, off:-76.0323, d:0,        a:116.0,    al:0,
    sym:[['c2','-s2','0','116.00·c2'], ['s2','c2','0','116.00·s2'], ['0','0','1','0']] },
  { joint:'elbow_flex',    s: 1, off:73.8248,  d:0,        a:135.0002, al:0,
    sym:[['c3','-s3','0','135.00·c3'], ['s3','c3','0','135.00·s3'], ['0','0','1','0']] },
  { joint:'wrist_flex',    s: 1, off:92.2075,  d:-0.1768,  a:0,        al:90,
    sym:[['c4','0','s4','0'], ['s4','0','-c4','0'], ['0','1','0','-0.18']] },
  { joint:'wrist_roll',    s:-1, off:1.2149,   d:159.2273, a:7.9024,   al:0,
    sym:[['c5','-s5','0','7.90·c5'], ['s5','c5','0','7.90·s5'], ['0','0','1','159.23']] },
];
const DH_BASE_MM = [38.8353, 0, 0];
const DH_LINKS = ['base_link', 'shoulder_link', 'upper_arm_link', 'lower_arm_link', 'wrist_link', 'gripper_link'];
const DH_LABELS = ['{0} base (pan axis, table)', '{1}', '{2}', '{3}', '{4} wrist centre', '{5} tool (gripper tip)'];
const D2R = Math.PI / 180;
// A in metres so it composes with the scene; numHTML prints translations in mm.
function dhA(theta, d, a, al) {
  const ct = Math.cos(theta), st = Math.sin(theta), ca = Math.cos(al), sa = Math.sin(al);
  return new THREE.Matrix4().set(ct, -st*ca, st*sa, a/1000*ct, st, ct*ca, -ct*sa, a/1000*st, 0, sa, ca, d/1000, 0, 0, 0, 1);
}
const dhBase = () => new THREE.Matrix4().makeTranslation(DH_BASE_MM[0]/1000, DH_BASE_MM[1]/1000, DH_BASE_MM[2]/1000);
const dhTheta = (p, q) => p.s * q + p.off * D2R;
// DH frame i expressed in its URDF link frame (constant): Cᵢ = (⁰Lᵢ at zero)⁻¹ · ⁰Fᵢ(zero).
const dhRel = {};

const isVar = s => /[cs]\d|φ/.test(s);
function symHTML(rows) {
  return [...rows, ['0','0','0','1']].map((r, ri) => r.map((v, c) =>
    `<span class="${ri === 3 ? 'z' : c === 3 ? 't' : isVar(v) ? 'v' : 'z'}">${v}</span>`).join('')).join('');
}
function numHTML(m) {
  const e = m.elements; let h = '';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    let v = e[c*4 + r] * (c === 3 && r < 3 ? 1000 : 1);
    if (Math.abs(v) < 5e-4) v = 0;
    h += `<span class="${r === 3 ? 'z' : c === 3 ? 't' : ''}">${v.toFixed(c === 3 ? 2 : 3)}</span>`;
  }
  return h;
}

let dimObjs = [];
function buildTransforms(file) {
  const box = $('pairs'); box.innerHTML = '';
  dimObjs.forEach(o => o.parent && o.parent.remove(o)); dimObjs = [];
  const exact = file === 'so101_new_calib.urdf';
  if (isDH()) { buildDH(exact); updateTransforms(); applyDims(); return; }
  for (const p of CHAIN) {
    const j = robot.joints[p.joint];
    if (!j) continue;
    const o = j.urdfNode?.querySelector('origin');
    const xyz = o?.getAttribute('xyz') ?? '', rpy = o?.getAttribute('rpy') ?? '';
    const len = j.position.length() * 1000;
    const lim = j.jointType !== 'fixed' ? `${(j.limit.lower*180/Math.PI).toFixed(1)}° … ${(j.limit.upper*180/Math.PI).toFixed(1)}°` : '–';
    const div = document.createElement('div'); div.className = 'card';
    div.innerHTML = `<h3 data-h="${p.joint}"></h3><div class="sub" data-sub="${p.joint}"></div>
      <div class="facts">
        <span>URDF joint</span><span>${p.joint} (${j.jointType})</span>
        <span>origin xyz</span><span>${xyz} m</span>
        <span>origin rpy</span><span>${rpy} rad</span>
        <span>axis</span><span>${j.jointType === 'fixed' ? '–' : j.axis.toArray().join(' ')}</span>
        <span>limits</span><span>${lim}</span>
        <span>offset length</span><span><b>${len.toFixed(2)} mm</b></span>
      </div>
      ${exact ? `<div class="mlabel">Symbolic</div><div class="eq" data-eq="${p.joint}"></div><div class="mat" data-sym="${p.joint}"></div>` : ''}
      <div class="mlabel">Numeric at current θ</div>
      <div class="theta" data-th="${p.joint}"></div>
      <div class="mat num" data-joint="${p.joint}"></div>`;
    box.appendChild(div);
    // dimension line from parent frame origin to this frame's origin, drawn in the parent frame
    const parent = j.parent;
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), j.position.clone()]);
    const line = new THREE.Line(geo, new THREE.LineDashedMaterial({ color:0x7fe0ff, dashSize:0.004, gapSize:0.003, depthTest:false }));
    line.computeLineDistances(); line.renderOrder = 10; parent.add(line); dimObjs.push(line);
    const l = label(`${len.toFixed(1)} mm`, 'dim'); l.position.copy(j.position).multiplyScalar(0.5); parent.add(l); dimObjs.push(l);
  }
  updateTransforms(); applyDims();
}

const SUB = ['₀','₁','₂','₃','₄','₅'], SUP = ['⁰','¹','²','³','⁴','⁵'];
function dimLine(parent, from, to, text, color) {
  if (from.distanceTo(to) < 0.0005) return;
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const line = new THREE.Line(geo, new THREE.LineDashedMaterial({ color, dashSize:0.004, gapSize:0.003, depthTest:false }));
  line.computeLineDistances(); line.renderOrder = 10; parent.add(line); dimObjs.push(line);
  const l = label(text, 'dim'); l.element.style.color = '#' + new THREE.Color(color).getHexString();
  l.position.copy(from).add(to).multiplyScalar(0.5); parent.add(l); dimObjs.push(l);
}

function buildDH(exact) {
  const box = $('pairs');
  // DH parameter table
  const rows = DH.map((p, i) => `<tr><td>${i+1}</td><td>${p.s < 0 ? '−' : ''}q${i+1}${p.off ? (p.off > 0 ? ' + ' : ' − ') + Math.abs(p.off).toFixed(2) + '°' : ''}</td>
    <td>${p.d.toFixed(2)}</td><td>${p.a.toFixed(2)}</td><td>${p.al}°</td></tr>`).join('');
  const table = document.createElement('div'); table.className = 'card';
  table.innerHTML = `<h3>DH table</h3><div class="sub">Aᵢ = Rz(θᵢ) · Tz(dᵢ) · Tx(aᵢ) · Rx(αᵢ), lengths in mm, qᵢ = motor/URDF angle</div>
    <table class="dht"><tr><th>i</th><th>θᵢ</th><th>dᵢ</th><th>aᵢ</th><th>αᵢ</th></tr>${rows}</table>
    <div class="note" style="margin-top:6px">Base offset ᴮT₀ = Trans(38.84, 0, 0): {0} sits on the pan axis at table level.
    q1 and q5 are negated because the URDF axes point along −Z and −X. Offsets come from the bent zero pose.</div>`;
  box.appendChild(table);
  // base card
  const b = document.createElement('div'); b.className = 'card';
  b.innerHTML = `<h3>ᴮT₀</h3><div class="sub">base_link → {0} base (fixed)</div>
    <div class="mlabel">Matrix</div><div class="mat">${symHTML([['1','0','0','38.84'], ['0','1','0','0'], ['0','0','1','0']])}</div>`;
  box.appendChild(b);
  DH.forEach((p, i) => {
    const div = document.createElement('div'); div.className = 'card';
    div.innerHTML = `<h3>${SUP[i]}A${SUB[i+1]}</h3><div class="sub">${DH_LABELS[i]} → ${DH_LABELS[i+1]}  (joint ${p.joint})</div>
      <div class="facts">
        <span>θ${i+1}</span><span>${p.s < 0 ? '−' : ''}q${i+1}${p.off ? (p.off > 0 ? ' + ' : ' − ') + Math.abs(p.off).toFixed(4) + '°' : ''}</span>
        <span>d${i+1}</span><span><b>${p.d.toFixed(2)} mm</b> (along z${i})</span>
        <span>a${i+1}</span><span><b>${p.a.toFixed(2)} mm</b> (along x${i+1})</span>
        <span>α${i+1}</span><span>${p.al}° (z${i} → z${i+1} about x${i+1})</span>
      </div>
      ${exact ? `<div class="mlabel">Symbolic (cᵢ = cos θᵢ, sᵢ = sin θᵢ)</div><div class="mat">${symHTML(p.sym)}</div>` : ''}
      <div class="mlabel">Numeric at current q</div>
      <div class="theta" data-th="dh${i}"></div>
      <div class="mat num" data-joint="dh${i}"></div>`;
    box.appendChild(div);
    // d along z_{i-1} (fixed in frame i-1), a along x_i (fixed in frame i)
    const fPrev = linkAxes.find(f => f.userData.link === DH_LINKS[i]);
    const fCur = linkAxes.find(f => f.userData.link === DH_LINKS[i+1]);
    if (fPrev && fCur) {
      dimLine(fPrev, new THREE.Vector3(), new THREE.Vector3(0, 0, p.d/1000), `d${i+1} = ${p.d.toFixed(1)}`, 0x7fe0ff);
      dimLine(fCur, new THREE.Vector3(-p.a/1000, 0, 0), new THREE.Vector3(), `a${i+1} = ${p.a.toFixed(1)}`, 0xff9de2);
    }
  });
}

const isDH = () => $('conv').value === 'dh';
const zup = () => $('conv').value === 'zup';
// Z-up matrix from the live URDF one: ⁱ⁻¹T′ᵢ = Cᵢ₋₁⁻¹ · ⁱ⁻¹Tᵢ · Cᵢ (C = rotation-only).
function toZup(j, m) {
  const child = j.children.find(c => c.isURDFLink);
  const cp = zupRot[j.parent.name] ?? new THREE.Matrix4(), cc = zupRot[child?.name] ?? new THREE.Matrix4();
  return cp.clone().invert().multiply(m).multiply(cc);
}
function updateTransforms() {
  if (!robot) return;
  const z = zup();
  $('convNote').textContent = CONV_NOTE[$('conv').value];
  if (isDH()) {
    const full = dhBase();
    DH.forEach((p, i) => {
      const q = +robot.joints[p.joint].angle, th = dhTheta(p, q);
      const A = dhA(th, p.d, p.a, p.al * D2R); full.multiply(A);
      document.querySelector(`[data-th="dh${i}"]`).textContent = `q${i+1} = ${(q/D2R).toFixed(1)}°  →  θ${i+1} = ${(th/D2R).toFixed(2)}°`;
      document.querySelector(`[data-joint="dh${i}"]`).innerHTML = numHTML(A);
    });
    const t = new THREE.Vector3().setFromMatrixPosition(full).multiplyScalar(1000);
    $('fullTitle').textContent = 'ᴮT₅';
    $('fullSub').textContent = '= ᴮT₀ · ⁰A₁ · ¹A₂ · ²A₃ · ³A₄ · ⁴A₅ (at current joint values)';
    $('full').innerHTML = numHTML(full);
    // live cross-check against the URDF chain (gripper_frame_link origin = tool tip)
    robot.updateMatrixWorld(true);
    const tipLink = robot.links.gripper_frame_link, check = tipLink
      ? new THREE.Vector3().setFromMatrixPosition(robot.matrixWorld.clone().invert().multiply(tipLink.matrixWorld)).multiplyScalar(1000)
      : null;
    $('tip').textContent = `tool tip in base_link: (${t.x.toFixed(1)}, ${t.y.toFixed(1)}, ${t.z.toFixed(1)}) mm`
      + (check ? `\nURDF tip check: error ${t.distanceTo(check).toFixed(3)} mm` : '');
    return;
  }
  $('fullTitle').textContent = '⁰T_E';
  $('fullSub').textContent = '= ⁰T₁ · ¹T₂ · ²T₃ · ³T₄ · ⁴T₅ · ⁵T_E (at current joint values)';
  const full = new THREE.Matrix4();
  CHAIN.forEach((p, i) => {
    const j = robot.joints[p.joint]; if (!j) return;
    j.updateMatrix();
    const m = z ? toZup(j, j.matrix) : j.matrix;
    full.multiply(m);
    const q = s => document.querySelector(s);
    q(`[data-h="${p.joint}"]`).textContent = p.name;
    q(`[data-sub="${p.joint}"]`).textContent = `${p.from} → ${p.to}`;
    const sym = q(`[data-sym="${p.joint}"]`); if (sym) sym.innerHTML = symHTML(z ? p.zup : p.sym);
    const eq = q(`[data-eq="${p.joint}"]`); if (eq) eq.textContent = z ? p.zq : (p.eq ?? '');
    const ang = +j.angle, n = i + 1;
    q(`[data-th="${p.joint}"]`).textContent = j.jointType === 'fixed' ? 'fixed' : z
      ? `θ${n} = ${ang.toFixed(3)} rad  →  q${n} = ${(p.zsign * ang).toFixed(3)} rad  (${(p.zsign * ang * 180 / Math.PI).toFixed(1)}°)`
      : `θ${n} = ${ang.toFixed(3)} rad  (${(ang * 180 / Math.PI).toFixed(1)}°)`;
    q(`[data-joint="${p.joint}"]`).innerHTML = numHTML(m);
  });
  const t = new THREE.Vector3().setFromMatrixPosition(full).multiplyScalar(1000);
  $('full').innerHTML = numHTML(full);
  $('tip').textContent = `end-effector in {0}: (${t.x.toFixed(1)}, ${t.y.toFixed(1)}, ${t.z.toFixed(1)}) mm`;
}
function applyDims() { dimObjs.forEach(o => o.visible = $('showDims').checked); }

function label(text, cls) {
  const d = document.createElement('div'); d.className = 'lbl ' + (cls||''); d.textContent = text;
  return new CSS2DObject(d);
}

function load(file) {
  if (robot) { world.remove(robot); robot = null; }
  linkAxes = []; linkLabels = []; jointAxes = []; jointLabels = [];
  const loader = new URDFLoader();
  loader.load(file, r => {
    robot = r; world.add(r);
    r.traverse(o => { if (o.isMesh) { o.userData.origMat = o.material; } });
    // joints are all 0 right after loading: record each link's zero-pose rotation relative to {0}
    r.updateMatrixWorld(true);
    const rootInv = r.matrixWorld.clone().invert();
    for (const k in zupRot) delete zupRot[k];
    for (const [name, link] of Object.entries(r.links)) {
      const rel = rootInv.clone().multiply(link.matrixWorld);
      zupRot[name] = new THREE.Matrix4().extractRotation(rel).transpose();
    }
    for (const k in dhRel) delete dhRel[k];
    let F = dhBase();
    DH_LINKS.forEach((name, i) => {
      if (i > 0) { const p = DH[i-1]; F = F.clone().multiply(dhA(dhTheta(p, 0), p.d, p.a, p.al * D2R)); }
      const link = r.links[name]; if (!link) return;
      dhRel[name] = rootInv.clone().multiply(link.matrixWorld).invert().multiply(F);
    });
    for (const [name, link] of Object.entries(r.links)) {
      const ax = makeFrame(); ax.userData.link = name; link.add(ax); linkAxes.push(ax);
      const l = label(name); l.userData.link = name; link.add(l); linkLabels.push(l);
    }
    for (const [name, j] of Object.entries(r.joints)) {
      if (j.jointType === 'fixed') continue;
      const dir = j.axis.clone().normalize();
      const arrow = meshArrow(axisMats[3]); arrow.quaternion.setFromUnitVectors(Y, dir);
      j.add(arrow); jointAxes.push(arrow);
      const l = label(name, 'joint'); l.position.copy(dir.clone().multiplyScalar(0.065)); j.add(l); jointLabels.push(l);
    }
    buildJoints(); buildTree(); applyDisplay(); buildTransforms(file);
    // optional ?q=a,b,c,d,e (rad) sets shoulder_pan … wrist_roll
    const qv = (new URLSearchParams(location.search).get('q') || '').split(',').filter(Boolean).map(Number);
    const sliders = [...document.querySelectorAll('#joints .j')];
    DH.slice(0, qv.length).forEach((p, i) => {
      const s = sliders.find(d => d.firstChild.textContent.trim() === p.joint)?.querySelector('input');
      if (s) { s.value = qv[i]; s.oninput(); }
    });
  });
}

function buildJoints() {
  const box = $('joints'); box.innerHTML = '';
  for (const [name, j] of Object.entries(robot.joints)) {
    if (j.jointType === 'fixed') continue;
    const lo = j.limit.lower ?? -Math.PI, hi = j.limit.upper ?? Math.PI;
    const div = document.createElement('div'); div.className = 'j';
    div.innerHTML = `${name} <span class="val">0.00</span><input type="range" min="${lo}" max="${hi}" step="0.001" value="0">`;
    const inp = div.querySelector('input'), val = div.querySelector('.val');
    inp.oninput = () => { robot.setJointValue(name, +inp.value); val.textContent = (+inp.value).toFixed(2) + ' rad'; updateTransforms(); };
    box.appendChild(div);
  }
}

function buildTree() {
  const lines = [];
  const walk = (o, d) => {
    for (const c of o.children) {
      if (c.isURDFJoint) {
        const p = c.position, r = c.rotation;
        lines.push(`${'  '.repeat(d)}└ ${c.name} [${c.jointType}]`);
        lines.push(`${'  '.repeat(d+1)}xyz ${p.x.toFixed(4)} ${p.y.toFixed(4)} ${p.z.toFixed(4)}`);
        lines.push(`${'  '.repeat(d+1)}rpy ${r.x.toFixed(3)} ${r.y.toFixed(3)} ${r.z.toFixed(3)}`);
        if (c.jointType !== 'fixed') lines.push(`${'  '.repeat(d+1)}axis ${c.axis.toArray().map(v=>v.toFixed(2)).join(' ')}`);
        walk(c, d+1);
      } else if (c.isURDFLink) { lines.push(`${'  '.repeat(d)}${c.name}`); walk(c, d); }
    }
  };
  lines.push(robot.name || 'robot'); walk(robot, 0);
  $('tree').textContent = lines.join('\n');
}

function applyDisplay() {
  if (!robot) return;
  const s = +$('axSize').value, t = +$('axThick').value;
  robot.traverse(o => {
    if (o.isMesh && o.userData.origMat) {
      o.visible = $('showMesh').checked;
      o.material = $('transparent').checked ? meshMat : o.userData.origMat;
    }
  });
  const fk = $('fkMode').checked, z = zup(), dh = isDH();
  // DH mode: frames are DH_LINKS only; the tool frame {5} replaces {E}
  const keep = o => !fk || (dh ? DH_LINKS.includes(o.userData.link) : o.userData.link in FK_FRAMES);
  linkAxes.forEach(f => {
    f.visible = $('showLinkAxes').checked && keep(f);
    f.children.forEach(a => a.isGroup && a.children.length === 2 && sizeArrow(a, s, t));
    const n = f.userData.link;
    f.position.set(0, 0, 0); f.quaternion.identity();
    if (dh && dhRel[n]) dhRel[n].decompose(f.position, f.quaternion, new THREE.Vector3());
    else if (z && zupRot[n]) f.quaternion.setFromRotationMatrix(zupRot[n]);
  });
  linkLabels.forEach(l => {
    l.visible = $('showLinkLabels').checked && keep(l);
    const n = l.userData.link, i = DH_LINKS.indexOf(n);
    const txt = fk ? (dh ? DH_LABELS[i] ?? '' : FK_FRAMES[n] ?? '') : n;
    l.element.textContent = fk && z ? txt.replace(/θ(\d)/, 'q$1') : txt;
    // keep the label on the frame origin it names
    l.position.set(0, 0, 0);
    if (dh && dhRel[n]) l.position.setFromMatrixPosition(dhRel[n]);
  });
  jointAxes.forEach(a => { a.visible = $('showJointAxis').checked && !fk; sizeArrow(a, s * 1.5, t * 0.8); });
  jointLabels.forEach(l => l.visible = $('showJointLabels').checked && !fk);
  const light = $('lightBg').checked;
  scene.background.set(light ? 0xffffff : 0x1e1f24);
  grid.visible = !light;
  meshMat.color.set(light ? 0x9aa3ad : 0xd8d8d8);
}

// Canvas export: render, then paint the visible HTML labels onto the image.
$('savePng').onclick = () => {
  renderer.render(scene, camera);
  const src = renderer.domElement, out = document.createElement('canvas');
  out.width = src.width; out.height = src.height;
  const ctx = out.getContext('2d'); ctx.drawImage(src, 0, 0);
  const k = devicePixelRatio, v = new THREE.Vector3();
  ctx.font = `bold ${13 * k}px monospace`; ctx.textBaseline = 'middle';
  for (const l of [...linkLabels, ...jointLabels, ...dimObjs.filter(o => o.isCSS2DObject)]) {
    if (!l.visible || !l.element.textContent) continue;
    let shown = true; l.traverseAncestors(a => { if (!a.visible) shown = false; });
    if (!shown) continue;
    l.getWorldPosition(v).project(camera);
    const x = (v.x + 1) / 2 * out.width + 8 * k, y = (1 - v.y) / 2 * out.height;
    const w = ctx.measureText(l.element.textContent).width;
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(x - 4 * k, y - 10 * k, w + 8 * k, 20 * k);
    ctx.fillStyle = '#fff'; ctx.fillText(l.element.textContent, x, y);
  }
  const a = document.createElement('a'); a.download = 'so101_fk_frames.png'; a.href = out.toDataURL(); a.click();
};

['fkMode','lightBg','showMesh','transparent','showLinkAxes','showLinkLabels','showJointAxis','showJointLabels','axSize','axThick']
  .forEach(id => $(id).addEventListener('input', applyDisplay));
$('file').onchange = e => load(e.target.value);
$('showDims').oninput = applyDims;
$('conv').onchange = () => { applyDisplay(); buildTransforms($('file').value); };
$('tfToggle').onclick = () => $('tf').classList.toggle('hidden');
$('zero').onclick = () => { document.querySelectorAll('#joints input').forEach(i => { i.value = 0; i.oninput(); }); };
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});
// optional ?conv=dh|zup|urdf in the URL
const qs = new URLSearchParams(location.search);
if (['dh','zup','urdf'].includes(qs.get('conv'))) $('conv').value = qs.get('conv');
load($('file').value);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera); });
</script>
</body>
</html>
